description "Lithium Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env LITHIUMD_BIN="/usr/bin/lithiumd"
env LITHIUMD_USER="lithium"
env LITHIUMD_GROUP="lithium"
env LITHIUMD_PIDDIR="/var/run/lithiumd"
# upstart can't handle variables constructed with other variables
env LITHIUMD_PIDFILE="/var/run/lithiumd/lithiumd.pid"
env LITHIUMD_CONFIGFILE="/etc/lithium/lithium.conf"
env LITHIUMD_DATADIR="/var/lib/lithiumd"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # lithiumd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$LITHIUMD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run lithiumd."
        echo "The setting must appear in $LITHIUMD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Lithium Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$LITHIUMD_PIDDIR"
    chmod 0755 "$LITHIUMD_PIDDIR"
    chown $LITHIUMD_USER:$LITHIUMD_GROUP "$LITHIUMD_PIDDIR"
    chown $LITHIUMD_USER:$LITHIUMD_GROUP "$LITHIUMD_CONFIGFILE"
    chmod 0660 "$LITHIUMD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$LITHIUMD_PIDFILE" \
    --chuid $LITHIUMD_USER:$LITHIUMD_GROUP \
    --exec "$LITHIUMD_BIN" \
    -- \
    -pid="$LITHIUMD_PIDFILE" \
    -conf="$LITHIUMD_CONFIGFILE" \
    -datadir="$LITHIUMD_DATADIR" \
    -disablewallet \
    -daemon
